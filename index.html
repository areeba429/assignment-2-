<body class="bg-pink-50 text-gray-800 font-sans">

  <header class="bg-pink-200 shadow-md p-4 sticky top-0 z-50">

      <h1 class="text-3xl font-bold text-pink-700">Flower Shop 🌸</h1>
      <nav class="space-x-4">

         class="w-full h-80 object-cover mt-4 rounded-lg shadow-lg" />

        <button class="mt-2 bg-pink-500 text-white px-4 py-1 rounded hover:bg-pink-600">Add to Cart</button>

        <button class="mt-2 bg-pink-500 text-white px-4 py-1 rounded hover:bg-pink-600">Add to Cart</button>
