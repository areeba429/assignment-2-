<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Flower Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-gray-800 font-sans">

  <header class="bg-pink-200 shadow-md p-4 sticky top-0 z-50">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold text-pink-700">Flower Shop 🌸</h1>
      <nav class="space-x-4">
        <a href="index.html" class="hover:text-white hover:bg-pink-500 px-3 py-1 rounded">Home</a>
        <a href="#" class="hover:text-white hover:bg-pink-500 px-3 py-1 rounded">About Us</a>
        <a href="#" class="hover:text-white hover:bg-pink-500 px-3 py-1 rounded">Contact Us</a>
        <a href="register.html" class="hover:text-white hover:bg-pink-500 px-3 py-1 rounded">Register</a>
        <a href="login.html" class="hover:text-white hover:bg-pink-500 px-3 py-1 rounded">Login</a>
      </nav>
    </div>
  </header>

  <section class="flex justify-center items-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-semibold text-pink-700 mb-4 text-center">Create an Account</h2>
      <form action="#" method="post" class="space-y-4">
        <div>
          <label for="name" class="block text-pink-800">Full Name</label>
          <input type="text" id="name" name="name" required class="w-full border border-pink-200 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300"/>
        </div>
        <div>
          <label for="email" class="block text-pink-800">Email</label>
          <input type="email" id="email" name="email" required class="w-full border border-pink-200 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300"/>
        </div>
        <div>
          <label for="password" class="block text-pink-800">Password</label>
          <input type="password" id="password" name="password" required class="w-full border border-pink-200 rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-300"/>
        </div>
        <button type="submit" class="w-full bg-pink-500 text-white py-2 rounded hover:bg-pink-600">Register</button>
      </form>
    </div>
  </section>

  <footer class="bg-pink-200 text-center py-4 mt-10">
    <p class="text-pink-800">&copy; 2025 Flower Shop. All rights reserved.</p>
  </footer>

</body>
</html>
